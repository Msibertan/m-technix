<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Автомобиль — М-Техникс</title>
    <meta name="description" content="Подробная информация об автомобиле. Фото, характеристики, описание." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body>

    <!-- Scroll Progress -->
    <div class="scroll-progress">
        <div class="scroll-progress__fill" id="scrollProgress"></div>
    </div>

    <!-- Car Detail Content — rendered by JS -->
    <main class="car-detail" id="carDetail">
        <!-- Loading -->
        <div class="catalog-loading" id="carLoading">
            <div class="catalog-loading__spinner"></div>
            <span>Загрузка автомобиля...</span>
        </div>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox__close" id="lightboxClose"><i data-lucide="x"></i></button>
        <button class="lightbox__prev" id="lightboxPrev"><i data-lucide="chevron-left"></i></button>
        <button class="lightbox__next" id="lightboxNext"><i data-lucide="chevron-right"></i></button>
        <img class="lightbox__img" id="lightboxImg" src="" alt="" />
        <div class="lightbox__counter" id="lightboxCounter"></div>
    </div>

    <script type="module" src="/js/pages/car.js"></script>
</body>

</html>
